<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>devMetrics — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --bg: #080c10;
  --surface: #0d1117;
  --surface2: #161b22;
  --border: #21262d;
  --accent: #00ff88;
  --accent2: #00c8ff;
  --accent-dim: rgba(0,255,136,0.12);
  --text: #e6edf3;
  --text-muted: #8b949e;
  --danger: #ff4757;
  --success: #00ff88;
  --glow: 0 0 20px rgba(0,255,136,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* Glowing orb */
body::after {
  content: '';
  position: fixed;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,255,136,0.06) 0%, transparent 70%);
  top: -200px; left: -200px;
  pointer-events: none;
  animation: drift 8s ease-in-out infinite alternate;
}

@keyframes drift {
  to { transform: translate(100px, 100px); }
}

/* Terminal blink cursor for title */
@keyframes blink { 50% { opacity: 0; } }

.wrapper {
  display: flex;
  width: 860px;
  max-width: 96vw;
  min-height: 540px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,255,136,0.05), 0 40px 80px rgba(0,0,0,0.6);
  position: relative;
  z-index: 1;
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== LEFT PANEL ===== */
.panel-left {
  width: 50%;
  padding: 48px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.panel-left::after {
  content: '';
  position: absolute;
  right: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--border), transparent);
}

.form-container {
  position: relative;
}

form {
  display: none;
  flex-direction: column;
  gap: 14px;
  animation: fadeIn 0.3s ease;
}

form.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.form-title {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  color: var(--text);
  margin-bottom: 6px;
}

.form-title span {
  color: var(--accent);
}

.form-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 10px;
  font-family: 'Space Mono', monospace;
}

.form-subtitle::before {
  content: '> ';
  color: var(--accent);
}

.input-group {
  position: relative;
}

.input-group i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  transition: color 0.2s;
}

input {
  width: 100%;
  padding: 11px 14px 11px 38px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

input::placeholder { color: var(--text-muted); font-size: 13px; }

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,255,136,0.08);
}

input:focus + i,
.input-group:focus-within i { color: var(--accent); }

/* Fix icon placement (icon is before input in markup) */
.input-group i { pointer-events: none; }

.btn-primary {
  padding: 12px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
  margin-top: 4px;
}

.btn-primary:hover {
  background: #00e07a;
  box-shadow: var(--glow);
  transform: translateY(-1px);
}

.btn-primary:active { transform: translateY(0); }

#message {
  font-size: 12px;
  font-family: 'Space Mono', monospace;
  padding: 8px 12px;
  border-radius: 6px;
  display: none;
}

#message.show { display: block; }
#message.success { background: rgba(0,255,136,0.1); color: var(--success); border: 1px solid rgba(0,255,136,0.2); }
#message.error { background: rgba(255,71,87,0.1); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }

/* ===== RIGHT PANEL ===== */
.panel-right {
  width: 50%;
  background: linear-gradient(145deg, #0d1f14 0%, #081a24 50%, #0d1117 100%);
  padding: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.panel-right::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border: 1px solid rgba(0,255,136,0.08);
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: pulse 4s ease-in-out infinite;
}

.panel-right::after {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  border: 1px solid rgba(0,200,255,0.06);
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: pulse 4s ease-in-out infinite 1s;
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
}

.brand-logo {
  font-family: 'Space Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  position: relative;
  z-index: 1;
  margin-bottom: 8px;
}

.brand-logo span { color: var(--accent); }
.brand-logo .cursor {
  display: inline-block;
  width: 3px; height: 28px;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}

.brand-tagline {
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
  margin-bottom: 32px;
}

.brand-stats {
  display: flex;
  gap: 20px;
  position: relative;
  z-index: 1;
  margin-bottom: 32px;
}

.stat {
  text-align: center;
}

.stat-num {
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  color: var(--accent);
  font-weight: 700;
}

.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

.btn-ghost {
  background: transparent;
  border: 1px solid rgba(0,255,136,0.4);
  color: var(--accent);
  padding: 10px 28px;
  border-radius: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
  position: relative;
  z-index: 1;
}

.btn-ghost:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  box-shadow: var(--glow);
}

.panel-switch-text {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  position: relative;
  z-index: 1;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--surface2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

<body>

<div class="wrapper">

  <!-- LEFT: Forms -->
  <div class="panel-left">
    <div class="form-container">

      <!-- SIGN IN -->
      <form id="signInForm" class="active">
        <div class="form-title">Welcome <span>Back</span></div>
        <div class="form-subtitle">authenticate to continue</div>

        <div class="input-group">
          <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" />
          <i class="fas fa-at"></i>
        </div>

        <button type="submit" class="btn-primary">SIGN IN →</button>
      </form>

      <!-- SIGN UP -->
      <form id="signUpForm">
        <div class="form-title">Create <span>Account</span></div>
        <div class="form-subtitle">link your platforms</div>

        <div class="input-group">
          <input id="userName" placeholder="Full name" />
          <i class="fas fa-user"></i>
        </div>
        <div class="input-group">
          <input id="userEmail" type="email" placeholder="Email address" />
          <i class="fas fa-at"></i>
        </div>
        <div class="input-group">
          <input id="codeforces" placeholder="Codeforces handle" />
          <i class="fas fa-trophy"></i>
        </div>
        <div class="input-group">
          <input id="github" placeholder="GitHub URL" />
          <i class="fab fa-github"></i>
        </div>
        <div class="input-group">
          <input id="leetcode" placeholder="LeetCode username (optional)" />
          <i class="fas fa-code"></i>
        </div>
        <div class="input-group">
          <input id="atcoder" placeholder="AtCoder username (optional)" />
          <i class="fas fa-server"></i>
        </div>

        <button type="submit" class="btn-primary">CREATE ACCOUNT →</button>
      </form>

      <div id="message"></div>
    </div>
  </div>

  <!-- RIGHT: Branding -->
  <div class="panel-right">
    <div class="brand-logo">dev<span>Metrics</span><span class="cursor"></span></div>
    <div class="brand-tagline">Code · Track · Conquer</div>

    <div class="brand-stats">
      <div class="stat">
        <div class="stat-num">CF</div>
        <div class="stat-label">Codeforces</div>
      </div>
      <div class="stat">
        <div class="stat-num">GH</div>
        <div class="stat-label">GitHub</div>
      </div>
      <div class="stat">
        <div class="stat-num">LC</div>
        <div class="stat-label">LeetCode</div>
      </div>
    </div>

    <div class="panel-switch-text" id="switchText">Don't have an account?</div>
    <button class="btn-ghost" id="toggleBtn">SIGN UP</button>
  </div>

</div>

<script>
const signInForm = document.getElementById("signInForm");
const signUpForm = document.getElementById("signUpForm");
const toggleBtn  = document.getElementById("toggleBtn");
const switchText = document.getElementById("switchText");
const message    = document.getElementById("message");

const userName   = document.getElementById("userName");
const userEmail  = document.getElementById("userEmail");
const leetcode   = document.getElementById("leetcode");
const codeforces = document.getElementById("codeforces");
const atcoder    = document.getElementById("atcoder");
const github     = document.getElementById("github");
const loginEmail = document.getElementById("loginEmail");

function showMsg(text, type) {
  message.textContent = text;
  message.className = 'show ' + type;
}

toggleBtn.addEventListener("click", () => {
  if (signInForm.classList.contains("active")) {
    signInForm.classList.remove("active");
    signUpForm.classList.add("active");
    switchText.textContent = "Already have an account?";
    toggleBtn.textContent = "SIGN IN";
  } else {
    signUpForm.classList.remove("active");
    signInForm.classList.add("active");
    switchText.textContent = "Don't have an account?";
    toggleBtn.textContent = "SIGN UP";
  }
  message.className = '';
  message.textContent = '';
});

signUpForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.className = '';

  const data = {
    name: userName.value.trim(),
    email: userEmail.value.trim().toLowerCase(),
    leetcode: leetcode.value.trim(),
    codeforces: codeforces.value.trim(),
    atcoder: atcoder.value.trim(),
    github: github.value.trim()
  };

  if (!data.name || !data.email) {
    showMsg('⚠ Name and email are required', 'error'); return;
  }

  try {
    const res    = await fetch("http://localhost:5000/saveLinks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const result = await res.json();

    if (!res.ok) { showMsg('⚠ ' + (result.error || "Signup failed"), 'error'); return; }

    showMsg('✓ Account created! Signing you in…', 'success');
    signUpForm.reset();
    setTimeout(() => toggleBtn.click(), 1200);
  } catch {
    showMsg('⚠ Cannot reach server', 'error');
  }
});

signInForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.className = '';

  const email = loginEmail.value.trim().toLowerCase();
  if (!email) { showMsg('⚠ Please enter your email', 'error'); return; }

  try {
    const res = await fetch(`http://localhost:5000/getUser/${email}`);
    if (!res.ok) { showMsg('⚠ User not found — please sign up', 'error'); return; }
    const user = await res.json();
    localStorage.setItem("email", user.email);
    window.location.href = "dashboard.html";
  } catch {
    showMsg('⚠ Cannot reach server', 'error');
  }
});
</script>
</body>
</html>
